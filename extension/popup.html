<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; margin: 0; padding: 14px 16px; font: 13px system-ui, sans-serif; color: #111; }
  h1 { margin: 0 0 12px; font-size: 14px; }
  label { display: block; margin: 10px 0 4px; }
  select { width: 100%; padding: 5px; font: inherit; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  p { margin: 12px 0 0; color: #666; font-size: 12px; line-height: 1.4; }
  @media (prefers-color-scheme: dark) { body { background: #212121; color: #eee; } p { color: #aaa; } }
</style>
</head>
<body>
  <h1>ChatGPT Voice Player</h1>
  <label for="voice">Voice</label>
  <select id="voice"></select>
  <label for="rate">Speed</label>
  <select id="rate"></select>
  <div class="row"><input type="checkbox" id="autoload"><label for="autoload" style="margin:0">Load audio in advance</label></div>
  <p>With “Load audio in advance” on, every finished reply near the screen is voiced right away, so Play starts instantly. Off: audio loads on the first click.</p>
  <script src="popup.js"></script>
</body>
</html>
